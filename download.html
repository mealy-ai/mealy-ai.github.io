  <script>
    // Must stay below the two links, not in <head>: it reads their hrefs, so it needs
    // them parsed. It still runs mid-parse, before paint. Sitting in <head> is what made
    // getElementById return null and silently skipped every redirect until 2026-08-28.
    (function () {
      var ua = navigator.userAgent || '';
      var android = /Android/.test(ua);
      // iPadOS in desktop mode reports as a Mac, and only maxTouchPoints gives it away.
      // Excluded for Android so the touch heuristic can never outvote an explicit UA.
      var ios = /iPhone|iPad|iPod/.test(ua) ||
        (!android && navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var el = document.getElementById(ios ? 'ios' : android ? 'android' : '');
      // replace, not assign: Back has to return to Instagram, not bounce through here again.
      if (el) location.replace(el.href);
    })();
  </script>
